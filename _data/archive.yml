projects:
  - index: "01"
    title: Human hormone receptor systems biology
    body: >-
      Systematic collection and integrative analysis of hormone receptors across human
      tissues, leading to a peer-reviewed study and the HOHC interactive resource.
    link_url: /resources/#hohc
    link_label: Explore HOHC
  - index: "02"
    title: Single-cell analysis of multiple myeloma
    body: >-
      Analysis of cellular states and communication within the multiple myeloma
      microenvironment, with a focus on interactions between malignant and
      mesenchymal cells.
  - index: "03"
    title: Clinical hypertension data
    body: >-
      Large-scale clinical data processing and analysis to investigate risk factors,
      associated disease, and variation in treatment response.

