<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.person.portrait | absolute_url }}">
<meta name="twitter:card" content="summary">

<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<meta name="theme-color" content="#06080b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">

<link rel="preload" as="font" type="font/woff2" href="{{ '/assets/fonts/inter.woff2' | relative_url }}" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{ '/assets/fonts/instrument-serif-italic.woff2' | relative_url }}" crossorigin>

<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) { /* private mode */ }
    document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
      ? saved
      : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  }());
</script>

<link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}?v={{ site.assets_version }}">
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.person.name }}",
  "jobTitle": "{{ site.person.role }}",
  "email": "mailto:{{ site.email }}",
  "url": "{{ site.url }}{{ site.baseurl }}/",
  "image": "{{ site.person.portrait | absolute_url }}",
  "affiliation": { "@type": "Organization", "name": "{{ site.person.institution }}" },
  "sameAs": [
    "{{ site.profiles.github }}",
    "{{ site.profiles.scholar }}",
    "{{ site.profiles.orcid }}",
    "{{ site.profiles.x }}"
  ]
}
</script>
