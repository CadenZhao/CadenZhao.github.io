<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Integrated research pipeline</title>
  <desc id="desc">A five-stage cycle from biological questions through perturbation, multi-omic measurement, modeling, and experimental validation.</desc>
  <defs>
    <linearGradient id="pipeline-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151A1C"/><stop offset="1" stop-color="#0D1113"/></linearGradient>
    <linearGradient id="pipeline-line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C8F16A"/><stop offset=".5" stop-color="#83E8DA"/><stop offset="1" stop-color="#9C88FF"/></linearGradient>
    <filter id="pipeline-glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="560" rx="32" fill="url(#pipeline-bg)"/>
  <g opacity=".08" stroke="#E9F1EC"><path d="M0 80h1400M0 160h1400M0 240h1400M0 320h1400M0 400h1400M0 480h1400"/><path d="M100 0v560M200 0v560M300 0v560M400 0v560M500 0v560M600 0v560M700 0v560M800 0v560M900 0v560M1000 0v560M1100 0v560M1200 0v560M1300 0v560"/></g>
  <path d="M150 280H1250" stroke="url(#pipeline-line)" stroke-width="4" fill="none"/>
  <path d="M1250 280C1320 280 1320 480 1150 480H250C80 480 80 280 150 280" stroke="url(#pipeline-line)" stroke-width="2" stroke-dasharray="8 10" fill="none" opacity=".55"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(150 280)"><circle r="64" fill="#1A211F" stroke="#C8F16A" stroke-width="3"/><circle r="10" fill="#C8F16A" filter="url(#pipeline-glow)"/><text text-anchor="middle" y="-92" fill="#C8F16A" font-size="14" letter-spacing="2">01 / QUESTION</text><text text-anchor="middle" y="96" fill="#E9F1EC" font-size="17">Biological</text><text text-anchor="middle" y="119" fill="#E9F1EC" font-size="17">problem</text></g>
    <g transform="translate(425 280)"><circle r="64" fill="#1A211F" stroke="#B1EE75" stroke-width="3"/><path d="M-22-22L22 22M22-22L-22 22" stroke="#B1EE75" stroke-width="7"/><text text-anchor="middle" y="-92" fill="#B1EE75" font-size="14" letter-spacing="2">02 / PERTURB</text><text text-anchor="middle" y="96" fill="#E9F1EC" font-size="17">CRISPR</text><text text-anchor="middle" y="119" fill="#E9F1EC" font-size="17">intervention</text></g>
    <g transform="translate(700 280)"><circle r="64" fill="#1A211F" stroke="#83E8DA" stroke-width="3"/><g fill="#83E8DA"><circle cx="-24" cy="-18" r="8"/><circle cx="12" cy="-27" r="12"/><circle cx="27" cy="13" r="7"/><circle cx="-13" cy="23" r="11"/></g><text text-anchor="middle" y="-92" fill="#83E8DA" font-size="14" letter-spacing="2">03 / MEASURE</text><text text-anchor="middle" y="96" fill="#E9F1EC" font-size="17">Single-cell</text><text text-anchor="middle" y="119" fill="#E9F1EC" font-size="17">+ spatial omics</text></g>
    <g transform="translate(975 280)"><circle r="64" fill="#1A211F" stroke="#8EB5FF" stroke-width="3"/><path d="M-31 19l22-35 21 20 24-31" fill="none" stroke="#8EB5FF" stroke-width="6"/><text text-anchor="middle" y="-92" fill="#8EB5FF" font-size="14" letter-spacing="2">04 / MODEL</text><text text-anchor="middle" y="96" fill="#E9F1EC" font-size="17">Mechanism</text><text text-anchor="middle" y="119" fill="#E9F1EC" font-size="17">+ prediction</text></g>
    <g transform="translate(1250 280)"><circle r="64" fill="#1A211F" stroke="#9C88FF" stroke-width="3"/><path d="M-28 3l18 18 39-43" fill="none" stroke="#9C88FF" stroke-width="7"/><text text-anchor="middle" y="-92" fill="#9C88FF" font-size="14" letter-spacing="2">05 / VALIDATE</text><text text-anchor="middle" y="96" fill="#E9F1EC" font-size="17">Next</text><text text-anchor="middle" y="119" fill="#E9F1EC" font-size="17">experiment</text></g>
  </g>
  <text x="700" y="522" text-anchor="middle" fill="#89938F" font-family="Arial, sans-serif" font-size="14" letter-spacing="3">ITERATIVE EXPERIMENT–MODEL LOOP</text>
</svg>
